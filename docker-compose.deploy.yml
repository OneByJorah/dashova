services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dashova-api
    ports:
      - "127.0.0.1:5013:42000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@shared-timescaledb:5432/dashova
      SECRET_KEY: dashova-demo-secret-key
    volumes:
      - ./api:/app
    restart: unless-stopped
    networks:
      - shared-infrastructure_default

networks:
  shared-infrastructure_default:
    external: true
